<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Jucaré F.C.</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        body {
            background-color: #121212; /* Fundo Dark profissional */
            color: #ffffff;
        }
        .bg-jucare-preto {
            background-color: #1a1a1a !important;
            border: 1px solid #ffcc00; /* Borda amarela sutil */
        }
        .text-jucare-amarelo {
            color: #ffcc00 !important;
        }
        .btn-jucare {
            background-color: #ffcc00 !important;
            color: #000000 !important;
            font-weight: bold;
        }
        .btn-jucare:hover {
            background-color: #e6b800 !important;
        }
        .card-partida {
            background-color: #262626;
            border-left: 5px solid #ffcc00; /* Detalhe do time na lateral */
            border-top: 1px solid #333;
            border-right: 1px solid #333;
            border-bottom: 1px solid #333;
        }
    </style>
</head>
<body>

    <div class="container mt-5" style="max-width: 600px;">
        
        <div class="text-center mb-4">
            <img src="Imagens/Jucare.jpg" alt="Logo Jucaré F.C." class="rounded-circle shadow" style="width: 100px; border: 3px solid #ffcc00;">
            <h1 class="mt-2 text-jucare-amarelo fw-bold">Jucaré F.C.</h1>
            
            <h5 class="text-white mt-3 fw-normal">
                Prazer, <strong class="text-jucare-amarelo" id="usuarioLogado">Treinador</strong>! Vamos começar os trabalhos?
            </h5>

            <div class="d-flex justify-content-center align-items-center gap-2 mt-2">
                <button onclick="fazerLogout()" class="btn btn-sm btn-outline-danger py-0 px-2" style="font-size: 12px;">Sair 🚪</button>
            </div>
        </div>

        <div class="card p-4 bg-jucare-preto text-white rounded shadow-lg mb-5">
            <h4 class="mb-3 text-jucare-amarelo text-center">Registrar Nova Partida</h4>
            
            <div class="row g-3">
                <div class="col-6">
                    <label class="form-label small">Time da Casa</label>
                    <input type="text" id="timeCasa" class="form-control" placeholder="Ex: Jucaré">
                </div>
                <div class="col-6">
                    <label class="form-label small">Placar Casa</label>
                    <input type="number" id="placarCasa" class="form-control" placeholder="0">
                </div>

                <div class="col-6">
                    <label class="form-label small">Time de Fora</label>
                    <input type="text" id="timeFora" class="form-control" placeholder="Ex: Sport">
                </div>
                <div class="col-6">
                    <label class="form-label small">Placar Fora</label>
                    <input type="number" id="placarFora" class="form-control" placeholder="0">
                </div>
            </div>

            <hr class="text-secondary my-4">

            <h5 class="text-jucare-amarelo mb-3 small fw-bold">EVENTOS DA PARTIDA</h5>
            <div class="mb-3">
                <label class="form-label small">⚽ Gols da Partida</label>
                <input type="text" id="golsPartida" class="form-control" placeholder="Ex: Matheus (2), Lucas (1)">
            </div>
            <div class="mb-3">
                <label class="form-label small">🎯 Assistências</label>
                <input type="text" id="assistenciaPartida" class="form-control" placeholder="Ex: Gabriel (1)">
            </div>
            <div class="mb-3">
                <label class="form-label small">🟨 Cartões</label>
                <input type="text" id="cartaoPartida" class="form-control" placeholder="Ex: Thiago (Amarelo)">
            </div>

            <button onclick="cadastrarPartida()" class="btn btn-jucare w-100 mt-2">Gravar Partida no Histórico</button>
        </div>

        <h4 class="text-jucare-amarelo mb-3 fw-bold">📋 Histórico de Jogos</h4>
        
        <div id="listaDeJogosNaTela"></div>

    </div>

    <script>
    // 🛡️ Resgata o nome guardado no login
    const treinadorLogado = localStorage.getItem("usuarioJucare");

    if (!treinadorLogado) {
        window.location.href = "index.html";
    }

    // 🚀 Executa assim que a página abre
    window.onload = function() {
        if (treinadorLogado) {
            document.getElementById("usuarioLogado").textContent = treinadorLogado;
        }
        puxarPartidasDoBanco();
    };

    function fazerLogout() {
        localStorage.removeItem("usuarioJucare");
        window.location.href = "index.html";
    }

    // 📋 BUSCAR PARTIDAS (Método GET correto para listar)
    async function puxarPartidasDoBanco() {
        const containerJogos = document.getElementById("listaDeJogosNaTela");
        
        try {
            // Requisita a lista real de partidas salvas na nuvem
            const resposta = await fetch('https://jucare-api.onrender.com/partidas');
            const partidas = await resposta.json();

            containerJogos.innerHTML = "";
            
            if (partidas.length === 0) {
                containerJogos.innerHTML = "<p class='text-muted text-center'>Nenhum jogo cadastrado no histórico ainda.</p>";
                return;
            }

            // Desenha os cards dinamicamente na tela
            partidas.forEach(function(partida) {
                containerJogos.innerHTML += `
                    <div class="card card-partida p-3 mb-3 text-white shadow">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <span class="badge bg-danger text-uppercase fw-bold" style="font-size: 10px;">Fim de Jogo</span>
                        </div>
                        
                        <div class="d-flex justify-content-between align-items-center my-2 px-3">
                            <h4 class="mb-0 fw-bold text-truncate" style="max-width: 40%;">${partida.time_casa}</h4>
                            <h2 class="mb-0 fw-bolder text-jucare-amarelo bg-dark px-3 py-1 rounded border border-secondary">${partida.gols_casa} X ${partida.gols_fora}</h2>
                            <h4 class="mb-0 fw-bold text-truncate text-end" style="max-width: 40%;">${partida.time_fora}</h4>
                        </div>
                        
                        <hr class="border-secondary my-2">
                        
                        <div class="small">
                            <p class="mb-1"><strong>⚽ Gols:</strong> ${partida.quem_fez_gols || 'Nenhum'}</p>
                            <p class="mb-1"><strong>🎯 Assistências:</strong> ${partida.quem_deu_assistência || 'Nenhuma'}</p>
                            <p class="mb-0"><strong>🟨 Cartões:</strong> ${partida.quem_levou_cartao || 'Nenhum'}</p>
                        </div>
                    </div>
                `;
            });

        } catch (error) {
            containerJogos.innerHTML = "<p class='text-danger text-center'>⚠️ Erro ao carregar o histórico de jogos do banco.</p>";
            console.error("Erro ao buscar dados:", error);
        }
    }

    // ⚽ CADASTRAR PARTIDA (Método POST correto para salvar na Render)
    async function cadastrarPartida() {
        const casa = document.getElementById("timeCasa").value.trim();
        const fora = document.getElementById("timeFora").value.trim();
        const golsCasa = Number(document.getElementById("placarCasa").value);
        const golsFora = Number(document.getElementById("placarFora").value);
        
        const quemFezGols = document.getElementById("golsPartida").value.trim();
        const quemDeuAssistencia = document.getElementById("assistenciaPartida").value.trim();
        const quemLevouCartao = document.getElementById("cartaoPartida").value.trim();    

        if (casa === "" || fora === "") {
            alert("⚠️ Por favor, digite o nome dos dois times!");
            return; 
        }

        try {
            // Enviando as informações para salvar direto na nuvem da Render
            const respuesta = await fetch("https://jucare-api.onrender.com/partidas", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    casa,
                    fora,
                    golsCasa,
                    golsFora,
                    quemFezGols,
                    quemDeuAssistencia,
                    quemLevouCartao
                })
            });

            if (respuesta.ok) {
                // Se gravou, limpa o formulário
                document.getElementById("timeCasa").value = "";
                document.getElementById("placarCasa").value = "";
                document.getElementById("timeFora").value = "";
                document.getElementById("placarFora").value = "";
                document.getElementById("golsPartida").value = "";
                document.getElementById("assistenciaPartida").value = "";
                document.getElementById("cartaoPartida").value = "";

                // Atualiza a lista na tela chamando a lista de novo
                puxarPartidasDoBanco();
            } else {
                alert("❌ Erro ao tentar salvar a partida.");
            }

        } catch (error) {
            alert("⚠️ Servidor fora do ar! A partida não pôde ser gravada.");
            console.error("Erro na requisição de cadastro:", error);
        }
    }
</script>
</body>
</html>
