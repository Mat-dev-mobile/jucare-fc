<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso - Jucaré F.C.</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
        }
        .bg-jucare-preto {
            background-color: #1a1a1a !important;
            border: 1px solid #ffcc00;
        }
        .text-jucare-amarelo {
            color: #ffcc00 !important;
        }
        .btn-jucare {
            background-color: #ffcc00 !important;
            color: #000000 !important;
            font-weight: bold;
        }
        .btn-jucare:hover {
            background-color: #e6b800 !important;
        }
    </style>
</head>
<body>

    <div class="container mt-5" style="max-width: 450px;">
        <div class="text-center mb-4">
            <img src="Imagens/Jucare.jpg" alt="Logo Jucaré F.C." class="rounded-circle shadow" style="width: 120px; border: 3px solid #ffcc00;">
            <h1 class="mt-2 text-jucare-amarelo fw-bold">Jucaré F.C.</h1>
            <p class="text-jucare-amarelo fw-semibold opacity-75">Acesso Restrito</p>
        </div>

        <div class="card p-4 bg-jucare-preto text-white rounded shadow-lg">
            <h5 class="text-center mb-3 text-jucare-amarelo">Identifique-se para Entrar</h5>
            
            <div class="mb-3">
                <label class="form-label small">Seu Nome</label>
                <input type="text" id="nomeTreinador" class="form-control" placeholder="Digite seu nome">
            </div>
            
            <div class="mb-3">
                <label class="form-label small">Chave de Acesso</label>
                <input type="password" id="chaveAcesso" class="form-control" placeholder="••••••••">
            </div>

            <button onclick="verificarAcesso()" class="btn btn-jucare w-100 mt-2">Entrar no Painel</button>
            <div id="erroLogin" class="text-danger small text-center mt-3 fw-bold"></div>
        </div>
    </div>

    <script>
    // Se o usuário já logou antes, manda ele direto para o painel de jogos
    if (localStorage.getItem("usuarioJucare")) {
        window.location.href = "partida.html";
    }

    // FUNÇÃO DE VERIFICAÇÃO CONECTADA À RENDER
    async function verificarAcesso() {
        const nomeInput = document.getElementById("nomeTreinador").value.trim();
        const chaveInput = document.getElementById("chaveAcesso").value;
        const erroDiv = document.getElementById("erroLogin");

        erroDiv.innerHTML = "";

        if (nomeInput === "") {
            erroDiv.innerHTML = "⚠️ Por favor, digite seu nome!";
            return;
        }

        try {
            // Conexão direta com a API da Render
            const resposta = await fetch('https://jucare-api.onrender.com/login', {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    nome: nomeInput,
                    chave: chaveInput
                })
            });

            const dados = await resposta.json();

            if (resposta.ok) {
                // Login aceito pelo servidor na nuvem
                localStorage.setItem("usuarioJucare", nomeInput);
                window.location.href = "partida.html";
            } else {
                // Caso a senha esteja errada, exibe o aviso retornado pelo Node
                erroDiv.innerHTML = `❌ ${dados.erro || 'Acesso negado!'}`;
            }

        } catch (error) {
            erroDiv.innerHTML = "⚠️ Erro ao conectar com o servidor do Jucaré na nuvem!";
            console.error("Erro na requisição:", error);
        }
    }
</script>
</body>
</html>
